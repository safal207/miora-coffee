name: Validate and deploy menu

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check reproducible catalog and JavaScript
        run: |
          python3 scripts/build-data.py
          python3 scripts/build-photos.py
          git diff --exit-code -- dist/menu-data.js dist/photo-data.js
          node --check dist/app.js
          node --check dist/core.js
          node --check dist/photos.js
          node --check dist/photo-data.js
          node --check dist/menu-data.js
          node --check dist/kiosk-data.js
          node --check dist/kiosk-core.js
          node --check dist/kiosk.js
          node --check dist/sandwich-preview.js
          node --check dist/video-stories.js
      - name: Verify catalog, assets and order integrity
        run: npm test
      - name: Upload website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish verified website
        id: deployment
        uses: actions/deploy-pages@v4
