name: Validate and deploy menu

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check reproducible catalog and JavaScript
        run: |
          python3 scripts/build-data.py
          python3 scripts/build-photos.py
          git diff --exit-code -- dist/menu-data.js dist/photo-data.js dist/original-photo-data.js dist/generated-photo-data.js dist/focus-photo-data.js dist/cake-photo-data.js dist/dessert-photo-data.js dist/turntable-data.js
          node --check dist/app.js
          node --check dist/core.js
          node --check dist/growth-engine.js
          node --check dist/taste-memory.js
          node --check dist/usual-order.js
          node --check dist/city-guide.js
          node --check dist/city-tour.js
          node --check dist/miora-reactions.js
          node --check dist/photos.js
          node --check dist/photo-data.js
          node --check dist/menu-data.js
          node --check dist/kiosk-data.js
          node --check dist/kiosk-core.js
          node --check dist/kiosk.js
          node --check dist/sandwich-preview.js
          node --check dist/video-stories.js
          node --check dist/desire-journey.js
          node --check dist/original-photo-data.js
          node --check dist/menu-motion.js
          node --check dist/focus-photo-data.js
          node --check dist/cake-photo-data.js
          node --check dist/dessert-photo-data.js
          node --check dist/turntable-data.js
          node --check dist/turntable.js
          node --check dist/cake-interiors.js
          node --check dist/generated-photo-data.js
      - name: Verify catalog, assets and order integrity
        run: npm test
      - name: Install Chromium for real browser smoke
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify Miora feed on mobile and desktop
        run: |
          python3 -m http.server 8123 --directory dist >/tmp/miora-smoke.log 2>&1 &
          sleep 2
          node tests/feed-smoke.mjs
          node tests/layout-smoke.mjs
          node tests/growth-smoke.mjs
          node tests/taste-memory-smoke.mjs
          node tests/usual-order-smoke.mjs
          node tests/city-guide-smoke.mjs
          node tests/miora-reactions-smoke.mjs
      - name: Upload feed screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miora-feed-browser-captures
          path: artifacts/*.png
          if-no-files-found: ignore
      - name: Upload website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish verified website
        id: deployment
        uses: actions/deploy-pages@v4
